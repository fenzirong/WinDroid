# ---------------------------------------------------------------------------
# WinDroid - project-wide Gradle settings
# ---------------------------------------------------------------------------

# JVM args for the Gradle daemon (kept modest so builds work on laptops).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Build performance. All three are configuration-cache safe with
# AGP 8.7.3 + Kotlin 2.0.21: no build script mutates the project model
# imperatively, so the configuration cache can be reused across builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
